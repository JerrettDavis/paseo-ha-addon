name: Paseo
version: "0.15.0-1-opiha.2"
slug: paseo
description: Configure Home Assistant with coding agents (Pi, Claude, Codex, Copilot, OpenCode, Oh My Pi, Muse Code, Antigravity) from the sidebar
url: https://github.com/JerrettDavis/paseo-ha-addon
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_title: Paseo
panel_icon: mdi:robot-outline
ports:
  6767/tcp: null
ports_description:
  6767/tcp: Direct Paseo access for apps/CLI (requires password)
map:
  - type: homeassistant_config
    read_only: false
  - type: addon_config
    read_only: false
homeassistant_api: true
options:
  workspace: /homeassistant
  git_snapshot: false
  providers:
    - pi
  env_vars: []
  hostnames: []
  log_level: info
  dictation: false
  voice_mode: false
  speech_provider: local
  relay: false
schema:
  workspace: str
  git_snapshot: bool
  providers:
    - list(claude|codex|copilot|opencode|pi|omp|muse|antigravity)
  env_vars:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: password
  password: password?
  hostnames:
    - str
  log_level: list(trace|debug|info|warn|error)
  dictation: bool
  voice_mode: bool
  speech_provider: list(local|openai)
  worktrees_root: str?
  relay: bool?
